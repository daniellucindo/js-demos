$(document).ready(function(){
  // Aplicar máscara nos campos de input
  $('[data-input]').mask('000.000.000.000', {reverse: true});
  
  // Formatar valores existentes nos campos data-total
  $('[data-total]').each((_, element) => {
    const value = Number(element.textContent.replace(/\D/g, '') || 0);
    $(element).text(value.toLocaleString('pt-BR'));
  });

  $('[data-table-price]').each((_, table) => {
    $('input', table).on('input', (e) => {
      const target = e.target;
      const row = target.closest('tr');
      const column = target.closest('td');
      const rowIndex = row.rowIndex;
      const columnIndex = column.cellIndex;
      const inputsRow = $('input', row);
      
      // Soma da linha
      const totalRow = inputsRow.map((i, input) => 
        Number(input.value.replace(/\D/g, '') || 0)
      ).toArray().filter(item => item).reduce((prev, current) => prev + current, 0);
      
      $(row).find('td[data-total]').text(totalRow.toLocaleString('pt-BR'));

      // Soma da coluna
      const inputsColumn = $(`td:nth-child(${columnIndex + 1}) input`, table);
      const totalColumn = inputsColumn.map((i, input) =>
        Number(input.value.replace(/\D/g, '') || 0)
      ).toArray().filter(item => item).reduce((prev, current) => prev + current, 0);

      $(`tr:last-child td:nth-child(${columnIndex + 1})`, table).text(totalColumn.toLocaleString('pt-BR'));

      // Total do valor
      const inputsTotalValue = $(`tr:last-child td:not(:last-child, :first-child)`, table);
      const totalValue = inputsTotalValue.map((i, input) =>
        Number(input.textContent.replace(/\D/g, '') || 0)
      ).toArray().filter(item => item).reduce((prev, current) => prev + current, 0);

      $('tr:last-child td:last-child', table).text(totalValue.toLocaleString('pt-BR'));
    });
  });
});
